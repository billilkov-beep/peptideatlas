services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to your HTTPS application address}
      DATABASE_URL: postgresql://atlas:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/atlas
      LOAD_CATALOG: "true"
    depends_on:
      database:
        condition: service_healthy
    mem_limit: 768m
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: atlas
    volumes:
      - atlas_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
volumes:
  atlas_postgres:
